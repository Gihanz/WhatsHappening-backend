name: Daily News Post

on:
  schedule:
    # Runs at 6:00 PM EST (11:00 PM UTC) every day
    - cron: '0 23 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  post-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger News Post
        run: |
          curl -X POST ${{ secrets.VERCEL_NEWS_ENDPOINT }} \
            -H "x-auth-token: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
