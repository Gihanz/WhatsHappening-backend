name: Daily Weather Post

on:
  schedule:
    # Runs at 7:00 AM EST (12:00 PM UTC) every day
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  post-weather:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Weather Post
        run: |
          curl -X POST "${{ secrets.VERCEL_WEATHER_ENDPOINT }}" \
            -H "x-auth-token: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail --show-error --silent || echo "Curl failed with exit code $?"